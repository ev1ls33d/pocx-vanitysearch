[package]
name = "vanitysearch-rust"
version = "1.0.0"
edition = "2021"
authors = ["Ported from VanitySearch by Jean Luc PONS"]
license = "GPL-3.0"

[dependencies]
# CUDA support for Rust
cuda-sys = "0.3"
cuda-runtime-sys = "0.3"

# Cryptographic primitives
sha2 = "0.10"
ripemd = "0.1"

# Utilities
hex = "0.4"
rand = "0.8"
rayon = "1.8"
num-bigint = "0.4"
num-traits = "0.2"

[lib]
name = "vanitysearch_rust"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "vanitysearch"
path = "src/main_rust.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[build-dependencies]
cc = "1.0"
